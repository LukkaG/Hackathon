<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Paciente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='aunalise_favicon.png') }}" type="image/png">
</head>
<body>
    <header>
        <nav class="main-nav">
            <ul>
                <li><a href="/">Lista de Pacientes</a></li>
                <li class="logo">
                    <a href="/">
                        <span>Aunalise</span>
                    </a>
                </li>
                <li><a href="/adicionar_form">Adicionar Paciente</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Adicionar Novo Paciente</h1>

        <form action="/adicionar" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Paciente:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="raca">Raça:</label>
                <input type="text" id="raca" name="raca" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo:</label>
                <input type="text" id="sexo" name="sexo" required>
            </div>

            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" step="0.01" id="peso" name="peso" required>
            </div>

            <div class="form-group">
                <label for="idade">Idade (anos):</label>
                <input type="number" id="idade" name="idade" required>
            </div>

            <div class="form-group">
                <label for="id_veterinario">ID Veterinário (Opcional):</label>
                <input type="text" id="id_veterinario" name="id_veterinario">
            </div>

            <div class="form-group">
                <label for="especie">Espécie:</label>
                <input type="text" id="especie" name="especie" required>
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento">
            </div>

            <div class="form-group">
                <label for="temperamento">Temperamento:</label>
                <input type="text" id="temperamento" name="temperamento">
            </div>

            <div class="form-group">
                <label for="historico_doencas">Histórico de Doenças:</label>
                <textarea id="historico_doencas" name="historico_doencas" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="estado_vacinal">Estado Vacinal:</label>
                <input type="text" id="estado_vacinal" name="estado_vacinal">
            </div>

            <div class="form-group">
                <label for="alergias">Alergias:</label>
                <textarea id="alergias" name="alergias" rows="2"></textarea>
            </div>

            <button type="submit">Adicionar Paciente</button>
        </form>
    </div>
</body>
</html>
